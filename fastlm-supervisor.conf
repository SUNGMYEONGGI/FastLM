[program:fastlm]
command=/home/ubuntu/git/FastLM/supervisor-start.sh
directory=/home/ubuntu/git/FastLM
user=ubuntu
autostart=true
autorestart=true
startretries=3
startsecs=30
redirect_stderr=true
stdout_logfile=/var/log/fastlm-supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/home/ubuntu",USER="ubuntu"
killasgroup=true
stopasgroup=true
