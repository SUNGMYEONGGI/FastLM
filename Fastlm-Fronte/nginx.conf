# HTTP에서 HTTPS로 리다이렉트 (new.fastlm.site)
server {
    listen 80;
    server_name new.fastlm.site;
    return 301 https://$server_name$request_uri;
}

# HTTP에서 HTTPS로 리다이렉트 (tool.fastlm.site)
server {
    listen 80;
    server_name tool.fastlm.site;
    return 301 https://$server_name$request_uri;
}

# HTTPS 서버 설정 (new.fastlm.site)
server {
    listen 443 ssl http2;
    server_name new.fastlm.site;
    
    # SSL 인증서 설정
    ssl_certificate /etc/letsencrypt/live/new.fastlm.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.fastlm.site/privkey.pem;
    
    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 보안 헤더
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # React Router를 위한 설정
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # API 요청을 백엔드로 프록시
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    
    # 정적 파일 캐싱 설정
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript;
}

